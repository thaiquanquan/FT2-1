<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popular Collections</title>
    <link rel="stylesheet" href="bai3.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="content">
            <h1>Popular Collections</h1>
            <div class="button-group">
                <button class="common-btn btn-profile">Profile</button>
                <button class="common-btn btn-newyork">New York</button>
                <button class="common-btn btn-relaxing">Relaxing</button>
                <button class="common-btn btn-person">Person</button>
                <button class="common-btn btn-fashion">Fashion</button>
            </div>
        </div>
        
        <div class="cards-wrapper">
            
            <div class="card people">
                <div class="image">
                    <img class="main-img" src="./img/person1.png" alt="Main person">
                    <div class="thumbnail-group">
                        <img src="./img/person2.png" alt="Person 2">
                        <img src="./img/person3.png" alt="Person 3">
                        <img src="./img/person4.png" alt="Person 4">
                    </div>
                </div>
                <div class="text">
                    <p>People</p>
                    <div class="count">
                        <img class="icon" src="./img/image-icon.png" alt="heart icon">
                        <p>144</p>
                    </div>
                </div>
            </div>

            
            <div class="card nature">
                <div class="image">
                    <img class="main-img" src="./img/nature1.png" alt="Main nature">
                    <div class="thumbnail-group">
                        <img src="./img/nature2.png" alt="Nature 2">
                        <img src="./img/nature3.png" alt="Nature 3">
                        <img src="./img/nature4.png" alt="Nature 4">
                    </div>
                </div>
                <div class="text">
                    <p>Nature</p>
                    <div class="count">
                        <img class="icon" src="./img/image-icon.png" alt="heart icon">
                        <p>89</p>
                    </div>
                </div>
            </div>

            
            <div class="card history">
                <div class="image">
                    <img class="main-img" src="./img/history1.png" alt="Main history">
                    <div class="thumbnail-group">
                        <img src="./img/history2.png" alt="History 2">
                        <img src="./img/history3.png" alt="History 3">
                        <img src="./img/history4.png" alt="History 4">
                    </div>
                </div>
                <div class="text">
                    <p>History</p>
                    <div class="count">
                        <img class="icon" src="./img/image-icon.png" alt="heart icon">
                        <p>112</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
