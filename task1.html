<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product</title>
  <link rel="stylesheet" href="task1.css">
</head>
<body>
  
    <div class="product">
      <div class="image">
        <img src="./img/headphone.png" alt="Razer Kraken Kitty Edt Gaming Headset Quartz">
      </div>
      <div class="product-content">
        <div class="shipping">
          <p>Free Shipping</p>
          <h2>Razer Kraken Kitty Edt Gaming Headset Quartz</h2>
        </div>
      
        <div class="product-price">
          <span class="new-price">1,599,000</span>
          <span class="old-price">799,000</span>
          <p class="offer-text">The offer is valid until April 3 or as long as stock lasts!</p>
        </div>
        
        <button class="btn-primary">Add to cart</button>
        
        <p class="stock">
          <span class="point"></span>
          50+ pcs. in stock.
        </p>
        
        <div class="btn-group">
          <button class="btn-secondary">
            <img src="./img/add_to_cart.svg">Add to cart
          </button>
          <button class="btn-wishlist">
            <img src="./img/add_wishlist.svg">Add to wishlist
          </button>
        </div>
      </div>
    </div>
</body>
</html>
